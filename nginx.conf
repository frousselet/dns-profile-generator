server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so they survive a reverse proxy or a remapped port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / {
        return 302 /dns-profile-generator/;
    }

    # Hashed build assets: cache forever, and never fall back to index.html.
    location /dns-profile-generator/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are handled by the client-side router.
    location /dns-profile-generator/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /dns-profile-generator/index.html;
    }
}
